<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Document Reader</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.mjs" type="module"></script>
  <script src="https://unpkg.com/mammoth@1.8.0/mammoth.browser.min.js"></script>
</head>
<body>
  <main class="card">
    <h1>Document Reader</h1>
    <p>Select a PDF or DOCX file, then click Read Aloud.</p>

    <input id="fileInput" type="file" accept=".pdf,.doc,.docx" />

    <div class="actions">
      <button id="readBtn">Read Aloud</button>
      <button id="stopBtn" type="button">Stop</button>
    </div>

    <p id="status" aria-live="polite"></p>
  </main>

  <script type="module" src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
